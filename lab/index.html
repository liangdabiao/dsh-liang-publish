<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梁工发布中控</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 21 4l-7.5 17-2.8-6.7L3 11.5z"/><path d="M10.7 14.3 21 4"/><path d="M4 19.5h3.2M9.4 21h4.8M16.4 19.5H20" stroke-width="1.4"/></svg>
    <h1>梁工发布中控</h1>
    <span class="sub" id="engineVersion"></span>
  </div>
  <div class="global-actions">
    <button id="btnDoctor" class="btn">🩺 登录体检</button>
    <button id="btnFollowers" class="btn">👥 采粉丝</button>
    <button id="btnMetrics" class="btn">📊 采流量（近30天）</button>
    <button id="btnNew" class="btn primary">✈️ 在对话里发起发布</button>
  </div>
</header>

<section class="fans card" id="fansCard">
  <h2>粉丝（今日）</h2>
  <div class="fans-grid" id="fansGrid"><span class="muted">还没有粉丝数据，先点「采粉丝」</span></div>
</section>

<main class="wrap">
  <div class="list-head">
    <h2>期数</h2>
    <span class="muted" id="epCount"></span>
  </div>
  <div id="epList" class="ep-list"><div class="muted pad">还没有登记的期数——在对话里给 AI 文章资料，按技能流程「make → plan」后出现在这里。</div></div>
</main>

<aside class="job card" id="jobCard" hidden>
  <div class="job-head">
    <h2 id="jobName">任务</h2>
    <span id="jobState" class="chip running">进行中</span>
    <button id="jobClose" class="x" title="收起">✕</button>
  </div>
  <pre id="jobLog" class="job-log"></pre>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <pre id="modalBody" class="modal-body"></pre>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
